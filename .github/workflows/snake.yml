name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E0245E&color_dots=#232849,#3E3570,#8E6BD8,#C8A2F0,#E0245E

      # keep the progress bar under the snake full and still
      - name: freeze snake progress bar
        run: sudo sed -i 's|</style>|.u{animation:none!important;transform:none!important}</style>|' dist/github-snake-dark.svg

      # streak card + contribution graph, built here so they never depend on outside services
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build stats cards
        run: sudo chown -R $(id -u):$(id -g) dist && node .github/scripts/stats.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: dist

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
